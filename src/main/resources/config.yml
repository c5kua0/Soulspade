# ==========================================
# Soulspade Configuration
# ==========================================

weapon:
  name: "&3&lSoulspade"

# ==========================================
# SOULSPADE OWNER
# ==========================================

owner:
  enabled: true
  name: "Jayymalapoks"

# ==========================================
# COMBAT
# ==========================================

combat:

  # Total physical attack damage
  attack-damage: 20.0

  # 20% of actual damage dealt is returned as HP
  lifesteal-percent: 20.0

  # Show heart particles when lifesteal activates
  lifesteal-particles: true

  # Play sound when lifesteal activates
  lifesteal-sound: true

# ==========================================
# Skill 1 - Dash
# ==========================================

dash:
  enabled: true

  range: 10.0

  cooldown: 3.0

  damage: 4.0

  effects:

    slowness:
      enabled: true
      duration: 5
      amplifier: 1

    weakness:
      enabled: true
      duration: 5
      amplifier: 1

  particles:
    enabled: true
    trail: "SOUL"
    amount: 8

# ==========================================
# Skill 2 - Energy Blast
# ==========================================

energy-blast:
  enabled: true

  range: 7.0

  cooldown: 5.0

  damage: 15.0

  # Bigger hitbox
  hit-radius: 1.5

  particles:
    enabled: true
    primary: "END_ROD"
    secondary: "SOUL_FIRE_FLAME"
    amount: 10

# ==========================================
# Skill 3 - Explosive Snowball
# ==========================================

explosive-snowball:
  enabled: true

  damage: 3.0

  radius: 3.0

  break-blocks: false

  cooldown: 0.0

  particles:
    enabled: true

    explosion: "EXPLOSION"

    primary: "SOUL_FIRE_FLAME"

    secondary: "END_ROD"

    explosion-amount: 3

    primary-amount: 35

    secondary-amount: 20

